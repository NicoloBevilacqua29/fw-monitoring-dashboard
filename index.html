<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FW Monitoring Dashboard</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card-hover: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 32px 40px 24px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -0.8px;
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    main {
      padding: 32px 40px 48px;
    }

    .site-section {
      margin-bottom: 44px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .section-title span {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .section-title small {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 22px;
    }

    .card {
      background: linear-gradient(180deg, #111827, #0f172a);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .server-name {
      font-size: 24px;
      font-weight: 800;
    }

    .domain {
      margin-top: 6px;
      color: #9cc8f5;
      font-size: 14px;
    }

    .badge {
      padding: 7px 13px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .up {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .down {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .warning,
    .starting {
      background: rgba(245, 158, 11, 0.15);
      color: var(--yellow);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
      color: #9cc8f5;
      font-size: 15px;
    }

    .details {
      display: none;
      margin-top: 22px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .card.open .details {
      display: block;
    }

    .service {
      display: grid;
      grid-template-columns: 70px 70px 90px 1fr;
      gap: 12px;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      font-size: 14px;
    }

    .service:last-child {
      border-bottom: none;
    }

    a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 16px;
      color: #9cc8f5;
      font-size: 14px;
    }

    .error {
      color: var(--red);
      padding: 20px;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 14px;
      background: rgba(239, 68, 68, 0.08);
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      header,
      main {
        padding-left: 20px;
        padding-right: 20px;
      }

      .service {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .summary {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>FW Monitoring Dashboard</h1>
    <p>Stato WebServiceHub Informatica</p>
  </header>

  <main>
    <div id="dashboard"></div>
    <div id="footer" class="footer"></div>
  </main>

  <script>
    const jsonFiles = [
      "data/infa_ws_status_as008pwc.json",
      "data/infa_ws_status_as009pwc.json",
      "data/infa_ws_status_as010pwc.json",
      "data/infa_ws_status_as011pwc.json",
      "data/infa_ws_status_as091pwc.json",
      "data/infa_ws_status_as092pwc.json",
      "data/infa_ws_status_as093pwc.json",
      "data/infa_ws_status_as094pwc.json"
    ];

    const serverGroups = {
      "Bernina": ["as008pwc", "as009pwc", "as010pwc", "as011pwc"],
      "Vimercate": ["as091pwc", "as092pwc", "as093pwc", "as094pwc"]
    };

    function getOverallStatus(server) {
      const services = server.services || [];

      const processUp = server.informatica_process_status === "UP";
      const allPortsUp = services.every(s => s.status === "UP");

      if (processUp && allPortsUp) return "UP";

      if (!processUp || services.some(s => s.status === "DOWN")) {
        return "DOWN";
      }

      return "WARNING";
    }

    function badgeClass(status) {
      if (status === "UP") return "badge up";
      if (status === "DOWN") return "badge down";
      if (status === "STARTING") return "badge starting";
      return "badge warning";
    }

    function renderServer(server) {
      const overallStatus = getOverallStatus(server);
      const services = server.services || [];

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="server-name">${server.host}</div>
            <div class="domain">${server.domain}</div>
          </div>
          <div class="${badgeClass(overallStatus)}">${overallStatus}</div>
        </div>

        <div class="summary">
          <span>Porte UP: ${services.filter(s => s.status === "UP").length}/${services.length}</span>
          <span>${server.timestamp}</span>
        </div>

        <div class="details">
          <div class="summary">
            <span>SSH: ${server.ssh_status}</span>
            <span>Informatica: ${server.informatica_process_status}</span>
          </div>

          <div style="margin-top:16px;">
            ${services.map(service => `
              <div class="service">
                <div><strong>${service.port}</strong></div>
                <div>${service.protocol.toUpperCase()}</div>
                <div class="${badgeClass(service.status)}">${service.status}</div>
                <div>
                  <a href="${service.url}" target="_blank">Test URL</a>
                  <span style="color:#94a3b8;"> · HTTP ${service.http_code}</span>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;

      card.addEventListener("click", (event) => {
        if (event.target.tagName.toLowerCase() === "a") return;
        card.classList.toggle("open");
      });

      return card;
    }

    function renderGroup(groupName, groupServers, dashboard) {
      const section = document.createElement("section");
      section.className = "site-section";

      section.innerHTML = `
        <div class="section-title">
          <span>${groupName}</span>
          <small>${groupServers.length} server</small>
        </div>
        <div class="grid"></div>
      `;

      const grid = section.querySelector(".grid");

      groupServers
        .sort((a, b) => a.host.localeCompare(b.host))
        .forEach(server => grid.appendChild(renderServer(server)));

      dashboard.appendChild(section);
    }

    async function loadDashboard() {
      const dashboard = document.getElementById("dashboard");
      const footer = document.getElementById("footer");

      dashboard.innerHTML = "";

      const servers = [];
      const errors = [];

      for (const file of jsonFiles) {
        try {
          const response = await fetch(file, { cache: "no-store" });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const text = await response.text();

          try {
            servers.push(JSON.parse(text));
          } catch (parseError) {
            errors.push(`
              <div class="error">
                JSON non valido:<br>
                <strong>${file}</strong><br><br>
                ${parseError.message}
              </div>
            `);
          }

        } catch (error) {
          errors.push(`
            <div class="error">
              Errore caricamento file:<br>
              <strong>${file}</strong><br><br>
              ${error.message}
            </div>
          `);
        }
      }

      Object.entries(serverGroups).forEach(([groupName, hosts]) => {
        const groupServers = servers.filter(server => hosts.includes(server.host));
        renderGroup(groupName, groupServers, dashboard);
      });

      const unknownServers = servers.filter(server =>
        !Object.values(serverGroups).flat().includes(server.host)
      );

      if (unknownServers.length > 0) {
        renderGroup("Altri server", unknownServers, dashboard);
      }

      if (errors.length > 0) {
        const errorContainer = document.createElement("div");
        errorContainer.innerHTML = errors.join("");
        dashboard.appendChild(errorContainer);
      }

      if (servers.length > 0) {
        const latestTimestamp = servers
          .map(s => s.timestamp)
          .sort()
          .reverse()[0];

        footer.textContent = `Ultimo aggiornamento dati: ${latestTimestamp}`;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
