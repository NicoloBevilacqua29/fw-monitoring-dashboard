<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FW Monitoring Dashboard</title>

  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2234;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #f1f5f9;
      --muted: #64748b;
      --green: #4ade80;
      --green-glow: rgba(74,222,128,0.15);
      --red: #f87171;
      --red-glow: rgba(248,113,113,0.2);
      --yellow: #fbbf24;
      --blue: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 40px 40px 32px;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px var(--green-glow);
      animation: pulse-green 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .header-dot.has-down {
      background: var(--red);
      box-shadow: 0 0 0 4px var(--red-glow);
      animation: pulse-red 1s ease-in-out infinite;
    }

    @keyframes pulse-green {
      0%,100% { box-shadow: 0 0 0 4px var(--green-glow); }
      50% { box-shadow: 0 0 0 8px transparent; }
    }

    @keyframes pulse-red {
      0%,100% { box-shadow: 0 0 0 4px var(--red-glow); }
      50% { box-shadow: 0 0 0 10px transparent; }
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 36px 40px 60px;
    }

    .monitor-block {
      margin-bottom: 64px;
    }

    .monitor-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 22px;
      letter-spacing: -0.2px;
    }

    .site-section {
      margin-bottom: 42px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
      position: relative;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .card.is-down {
      animation: blink-border 1.2s ease-in-out infinite;
    }

    @keyframes blink-border {
      0%,100% {
        border-color: rgba(248,113,113,0.15);
        box-shadow: none;
      }
      50% {
        border-color: rgba(248,113,113,0.7);
        box-shadow: 0 0 18px rgba(248,113,113,0.2);
      }
    }

    .card-collapsed {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .status-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 800;
    }

    .ring-up {
      background: rgba(74,222,128,0.1);
      color: var(--green);
      border: 1.5px solid rgba(74,222,128,0.3);
    }

    .ring-down {
      background: rgba(248,113,113,0.1);
      color: var(--red);
      border: 1.5px solid rgba(248,113,113,0.5);
    }

    .ring-warn {
      background: rgba(251,191,36,0.1);
      color: var(--yellow);
      border: 1.5px solid rgba(251,191,36,0.3);
    }

    .server-name {
      font-size: 16px;
      font-weight: 700;
    }

    .server-domain {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .ports-pill {
      font-size: 12px;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .chevron {
      width: 20px;
      height: 20px;
      color: var(--muted);
      transition: transform 0.25s;
      flex-shrink: 0;
    }

    .card.open .chevron {
      transform: rotate(180deg);
    }

    .card-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      border-top: 0 solid var(--border);
      background: rgba(0,0,0,0.2);
      padding: 0 22px;
    }

    .card.open .card-details {
      max-height: 1200px;
      border-top: 1px solid var(--border);
      padding: 18px 22px;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .meta-chip {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .meta-chip span {
      color: var(--text);
      font-weight: 600;
    }

    .services-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .service-row {
      display: grid;
      grid-template-columns: 54px 56px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .cdc-row {
      display: grid;
      grid-template-columns: 1fr 120px 80px 90px;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .svc-badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      justify-self: start;
      white-space: nowrap;
    }

    .svc-up {
      background: rgba(74,222,128,0.12);
      color: var(--green);
    }

    .svc-down {
      background: rgba(248,113,113,0.12);
      color: var(--red);
    }

    .svc-warn {
      background: rgba(251,191,36,0.12);
      color: var(--yellow);
    }

    .svc-link {
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .timestamp {
      color: var(--muted);
      font-size: 11px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .footer {
      padding: 0 40px 40px;
      color: var(--muted);
      font-size: 12px;
    }

    #alert-banner {
      display: none;
      margin: 24px 40px 0;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.35);
      cursor: pointer;
    }

    #alert-banner.visible {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .alert-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(248,113,113,0.15);
      border: 1.5px solid rgba(248,113,113,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 900;
      color: var(--red);
    }

    .alert-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      margin-bottom: 6px;
    }

    .alert-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .alert-list li {
      font-size: 12px;
      color: #fca5a5;
    }

    .alert-dismiss {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(100,116,139,0.35);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .error {
      color: var(--red);
      padding: 18px;
      border: 1px solid rgba(248,113,113,0.35);
      border-radius: 12px;
      background: rgba(248,113,113,0.08);
      margin-bottom: 16px;
      font-size: 13px;
    }

    @media (max-width:600px) {
      header, main, .footer, #alert-banner {
        padding-left: 20px;
        padding-right: 20px;
      }

      .service-row,
      .cdc-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

<div id="alert-banner">
  <div class="alert-icon">!</div>

  <div class="alert-body">
    <div class="alert-title">
      Attenzione — sistemi in stato KO
    </div>

    <ul class="alert-list" id="alert-list"></ul>
  </div>

  <button class="alert-dismiss" id="alert-dismiss">
    Nascondi
  </button>
</div>

<header>
  <div class="header-inner">
    <div class="header-dot" id="header-dot"></div>

    <div>
      <h1>FW Monitoring</h1>
      <p>WebServiceHub & CDC Monitoring</p>
    </div>
  </div>
</header>

<main>

  <div class="monitor-block">
    <div class="monitor-title">
      WebServiceHub Monitoring
    </div>

    <div id="ws-dashboard"></div>
  </div>

  <div class="monitor-block">
    <div class="monitor-title">
      CDC Monitoring
    </div>

    <div id="cdc-dashboard"></div>
  </div>

</main>

<div id="footer" class="footer"></div>

<script>

const WS_GROUPS = {
  Bernina: [
    "as008pwc",
    "as009pwc",
    "as010pwc",
    "as011pwc"
  ],

  Vimercate: [
    "as091pwc",
    "as092pwc",
    "as093pwc",
    "as094pwc"
  ]
};

// Nomi dei file JSON CDC prodotti dalla sh (uno per cluster)
const CDC_FILES = [
  "infa_cdc_cluster_CDC95",
  "infa_cdc_cluster_CDC96",
  "infa_cdc_cluster_CDC102"
];

function svcClass(status) {

  if (
    status === "UP" ||
    status === "RUNNING"
  ) {
    return "svc-up";
  }

  if (
    status === "WARNING" ||
    status === "STARTING" ||
    status === "RUNNING_RECENT"
  ) {
    return "svc-warn";
  }

  return "svc-down";
}

function ringClass(status) {

  if (status === "UP") {
    return "ring-up";
  }

  if (status === "WARNING") {
    return "ring-warn";
  }

  return "ring-down";
}

function wsStatus(server) {

  const infa =
    server.informatica_process_status === "UP";

  const ports =
    server.services.every(
      x => x.status === "UP"
    );

  if (infa && ports) {
    return "UP";
  }

  return "DOWN";
}

function cdcStatus(cluster) {
  return cluster.cluster_status || "DOWN";
}

function createSection(title,count) {

  const section =
    document.createElement("section");

  section.className = "site-section";

  section.innerHTML = `
    <div class="section-header">
      <span class="section-label">${title}</span>
      <div class="section-line"></div>
      <span class="section-count">${count}</span>
    </div>
    <div class="grid"></div>
  `;

  return section;
}

function renderWS(server) {

  const status = wsStatus(server);

  const up =
    server.services.filter(
      x => x.status === "UP"
    ).length;

  const total =
    server.services.length;

  const services =
    server.services.map(s => `
      <div class="service-row">

        <span>${s.port}</span>

        <span>${s.protocol}</span>

        <span class="svc-badge ${svcClass(s.status)}">
          ${s.status}
        </span>

        <a
          class="svc-link"
          href="${s.url}"
          target="_blank"
          onclick="event.stopPropagation()"
        >
          Test URL
        </a>

      </div>
    `).join("");

  return `
  <div class="card ${status !== 'UP' ? 'is-down':''}">
    <div class="card-collapsed">

      <div class="card-left">

        <div class="status-ring ${ringClass(status)}">
          ${status === 'UP' ? '↑' : '↓'}
        </div>

        <div>
          <div class="server-name">
            ${server.host}
          </div>

          <div class="server-domain">
            ${server.domain}
          </div>
        </div>

      </div>

      <div class="card-right">

        <div class="ports-pill">
          ${up}/${total} porte
        </div>

        <div class="chevron">⌄</div>

      </div>

    </div>

    <div class="card-details">

      <div class="meta-row">

        <div class="meta-chip">
          SSH
          <span>${server.ssh_status}</span>
        </div>

        <div class="meta-chip">
          Informatica
          <span>
            ${server.informatica_process_status}
          </span>
        </div>

      </div>

      <div class="services-list">
        ${services}
      </div>

      <div class="timestamp">
        ${server.timestamp}
      </div>

    </div>
  </div>
  `;
}

function renderCDC(server) {

  const status =
    cdcStatus(server);

  const rows =
    (server.cdc || [])
    .map(c => `
      <div class="cdc-row">

        <div>
          ${c.name}
        </div>

        <div class="svc-badge ${svcClass(c.status)}">
          ${c.status}
        </div>

        <div>
          PID ${c.pid ?? '-'}
        </div>

        <div>
          ${c.elapsed ?? '-'}
        </div>

      </div>
    `)
    .join("");

  return `
  <div class="card ${status !== 'UP' ? 'is-down':''}">
    <div class="card-collapsed">

      <div class="card-left">

        <div class="status-ring ${ringClass(status)}">
          ${status === 'UP' ? '↑' :
            status === 'WARNING' ? '!' : '↓'}
        </div>

        <div>

          <div class="server-name">
            ${server.host}
          </div>

          <div class="server-domain">
            ${server.informatica_version}
          </div>

        </div>

      </div>

      <div class="card-right">

        <div class="ports-pill">
          ${cluster.cdc_running}/${cluster.cdc_total} CDC
        </div>

        <div class="chevron">⌄</div>

      </div>

    </div>

    <div class="card-details">

      <div class="meta-row">

        <div class="meta-chip">
          Catalina
          <span>
            ${server.catalina_status}
          </span>
        </div>

        <div class="meta-chip">
          Pair
          <span>
            ${server.pair_host}
          </span>
        </div>

      </div>

      <div class="services-list">
        ${rows}
      </div>

      <div class="timestamp">
        ${server.timestamp}
      </div>

    </div>

  </div>
  `;
}

async function loadJSON(path) {

  try {

    const r = await fetch(path);

    if (!r.ok) {
      return null;
    }

    return await r.json();

  } catch {

    return null;
  }
}

async function init() {

  const wsFiles = [
    "as008pwc","as009pwc","as010pwc","as011pwc",
    "as091pwc","as092pwc","as093pwc","as094pwc"
  ];

  // CDC: un JSON per cluster (non più per host)

  const wsData = [];
  const cdcData = [];

  for (const host of wsFiles) {

    const d =
      await loadJSON(
        `data/infa_ws_status_${host}.json`
      );

    if (d) wsData.push(d);
  }

  for (const file of CDC_FILES) {
    const d = await loadJSON(`data/${file}.json`);
    if (d) cdcData.push(d);
  }

  const alerts = [];

  wsData.forEach(x => {
    if (wsStatus(x) !== "UP") {
      alerts.push(
        `${x.host} WebServiceHub`
      );
    }
  });

  cdcData.forEach(x => {
    if (cdcStatus(x) !== "UP") {
      alerts.push(`${x.cluster} CDC — ${x.cdc_stopped} workflow KO`);
    }
  });

  if (alerts.length > 0) {

    document
      .getElementById("header-dot")
      .classList.add("has-down");

    document
      .getElementById("alert-banner")
      .classList.add("visible");

    const ul =
      document.getElementById("alert-list");

    alerts.forEach(a => {

      const li =
        document.createElement("li");

      li.textContent = a;

      ul.appendChild(li);

    });
  }

  document
    .getElementById("alert-dismiss")
    .onclick = () =>
      document
        .getElementById("alert-banner")
        .remove();

  const wsContainer =
    document.getElementById(
      "ws-dashboard"
    );

  Object.entries(WS_GROUPS)
    .forEach(([name,hosts]) => {

      const servers =
        wsData.filter(
          x => hosts.includes(x.host)
        );

      const section =
        createSection(
          name,
          `${servers.length} server`
        );

      const grid =
        section.querySelector(".grid");

      servers.forEach(s => {

        const wrap =
          document.createElement("div");

        wrap.innerHTML =
          renderWS(s);

        const card =
          wrap.firstElementChild;

        card.onclick =
          () => card.classList.toggle("open");

        grid.appendChild(card);

      });

      wsContainer.appendChild(section);

    });

  const cdcContainer =
    document.getElementById(
      "cdc-dashboard"
    );

  // Un'unica sezione CDC con tutti i cluster
  const cdcSection = createSection("Informatica CDC Clusters", `${cdcData.length} cluster`);
  const cdcGrid = cdcSection.querySelector(".grid");

  cdcData.forEach(cluster => {
    const wrap = document.createElement("div");
    wrap.innerHTML = renderCDC(cluster);
    const card = wrap.firstElementChild;
    card.onclick = () => card.classList.toggle("open");
    cdcGrid.appendChild(card);
  });

  cdcContainer.appendChild(cdcSection);

  document
    .getElementById("footer")
    .textContent =
      "Dashboard aggiornata automaticamente da Outlook + GitHub";
}

init();

</script>

</body>
</html>
