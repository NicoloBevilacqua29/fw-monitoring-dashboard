<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FW Monitoring Dashboard</title>

  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2234;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #f1f5f9;
      --muted: #64748b;
      --green: #4ade80;
      --green-glow: rgba(74,222,128,0.15);
      --red: #f87171;
      --red-glow: rgba(248,113,113,0.2);
      --yellow: #fbbf24;
      --blue: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 40px 40px 32px;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px var(--green-glow);
      animation: pulse-green 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .header-dot.has-down {
      background: var(--red);
      box-shadow: 0 0 0 4px var(--red-glow);
      animation: pulse-red 1s ease-in-out infinite;
    }

    @keyframes pulse-green {
      0%,100% { box-shadow: 0 0 0 4px var(--green-glow); }
      50% { box-shadow: 0 0 0 8px transparent; }
    }

    @keyframes pulse-red {
      0%,100% { box-shadow: 0 0 0 4px var(--red-glow); }
      50% { box-shadow: 0 0 0 10px transparent; }
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 36px 40px 60px;
    }

    .site-section {
      margin-bottom: 48px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      opacity: 0;
      transition: opacity 0.3s;
      background: radial-gradient(
        600px at var(--mx,50%) var(--my,50%),
        rgba(255,255,255,0.03),
        transparent 60%
      );
      pointer-events: none;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card.is-down {
      animation: blink-border 1.2s ease-in-out infinite;
    }

    @keyframes blink-border {
      0%,100% {
        border-color: rgba(248,113,113,0.15);
        box-shadow: none;
      }
      50% {
        border-color: rgba(248,113,113,0.7);
        box-shadow: 0 0 18px rgba(248,113,113,0.2);
      }
    }

    .card.is-down .status-ring {
      animation: blink-ring 1.2s ease-in-out infinite;
    }

    @keyframes blink-ring {
      0%,100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .card-collapsed {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .status-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 800;
    }

    .ring-up {
      background: rgba(74,222,128,0.1);
      color: var(--green);
      border: 1.5px solid rgba(74,222,128,0.3);
    }

    .ring-down {
      background: rgba(248,113,113,0.1);
      color: var(--red);
      border: 1.5px solid rgba(248,113,113,0.5);
    }

    .ring-warn {
      background: rgba(251,191,36,0.1);
      color: var(--yellow);
      border: 1.5px solid rgba(251,191,36,0.3);
    }

    .server-name {
      font-size: 16px;
      font-weight: 700;
    }

    .server-domain {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .ports-pill {
      font-size: 12px;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .chevron {
      width: 20px;
      height: 20px;
      color: var(--muted);
      transition: transform 0.25s;
      flex-shrink: 0;
    }

    .card.open .chevron {
      transform: rotate(180deg);
    }

    .card-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      border-top: 0 solid var(--border);
      background: rgba(0,0,0,0.2);
      padding: 0 22px;
    }

    .card.open .card-details {
      max-height: 600px;
      border-top: 1px solid var(--border);
      padding: 18px 22px;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .meta-chip {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .meta-chip span {
      color: var(--text);
      font-weight: 600;
    }

    .services-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .service-row {
      display: grid;
      grid-template-columns: 54px 56px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      transition: border-color 0.15s;
    }

    .service-row:hover {
      border-color: var(--border-hover);
    }

    .svc-port {
      font-weight: 700;
      font-size: 14px;
    }

    .svc-proto {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .svc-badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      justify-self: start;
    }

    .svc-up {
      background: rgba(74,222,128,0.12);
      color: var(--green);
    }

    .svc-down {
      background: rgba(248,113,113,0.12);
      color: var(--red);
    }

    .svc-warn {
      background: rgba(251,191,36,0.12);
      color: var(--yellow);
    }

    .svc-link {
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .svc-link:hover {
      text-decoration: underline;
    }

    .svc-http {
      color: var(--muted);
      font-size: 11px;
    }

    .timestamp {
      color: var(--muted);
      font-size: 11px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .footer {
      padding: 0 40px 40px;
      color: var(--muted);
      font-size: 12px;
    }

    #alert-banner {
      display: none;
      margin: 24px 40px 0;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.35);
      cursor: pointer;
      animation: banner-in 0.4s ease;
    }

    @keyframes banner-in {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #alert-banner.visible {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .alert-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(248,113,113,0.15);
      border: 1.5px solid rgba(248,113,113,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 900;
      color: var(--red);
      animation: blink-ring 1.2s ease-in-out infinite;
    }

    .alert-body {
      flex: 1;
    }

    .alert-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      margin-bottom: 6px;
    }

    .alert-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .alert-list li {
      font-size: 12px;
      color: #fca5a5;
    }

    .alert-dismiss {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(100,116,139,0.35);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .alert-dismiss:hover {
      background: rgba(100,116,139,0.55);
    }

    .error {
      color: var(--red);
      padding: 18px;
      border: 1px solid rgba(248,113,113,0.35);
      border-radius: 12px;
      background: rgba(248,113,113,0.08);
      margin-bottom: 16px;
      font-size: 13px;
    }

    @media (max-width:600px) {
      header, main, .footer, #alert-banner {
        padding-left: 20px;
        padding-right: 20px;
      }

      .service-row {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="header-dot" id="header-dot"></div>
      <div>
        <h1>FW Monitoring</h1>
        <p>Stato WebServiceHub Informatica</p>
      </div>
    </div>
  </header>

  <div id="alert-banner">
    <div class="alert-icon">!</div>
    <div class="alert-body">
      <div class="alert-title">Attenzione — macchine in stato KO</div>
      <ul class="alert-list" id="alert-list"></ul>
    </div>
    <button class="alert-dismiss" id="alert-dismiss">Nascondi</button>
  </div>

  <main>
    <div id="dashboard"></div>
  </main>

  <div id="footer" class="footer"></div>

  <script>
    const jsonFiles = [
      "data/infa_ws_status_as008pwc.json",
      "data/infa_ws_status_as009pwc.json",
      "data/infa_ws_status_as010pwc.json",
      "data/infa_ws_status_as011pwc.json",
      "data/infa_ws_status_as091pwc.json",
      "data/infa_ws_status_as092pwc.json",
      "data/infa_ws_status_as093pwc.json",
      "data/infa_ws_status_as094pwc.json"
    ];

    const serverGroups = {
      "Bernina": ["as008pwc", "as009pwc", "as010pwc", "as011pwc"],
      "Vimercate": ["as091pwc", "as092pwc", "as093pwc", "as094pwc"]
    };

    const cardMap = {};

    function getStatus(server) {
      const services = server.services || [];

      const processUp = server.informatica_process_status === "UP";
      const allUp = services.every(p => p.status === "UP");

      if (processUp && allUp) return "UP";

      if (!processUp || services.some(p => p.status === "DOWN")) {
        return "DOWN";
      }

      return "WARN";
    }

    function ringClass(status) {
      if (status === "UP") return "ring-up";
      if (status === "DOWN") return "ring-down";
      return "ring-warn";
    }

    function svcClass(status) {
      if (status === "UP") return "svc-up";
      if (status === "DOWN") return "svc-down";
      return "svc-warn";
    }

    function renderCard(server) {
      const status = getStatus(server);
      const services = server.services || [];
      const upCount = services.filter(s => s.status === "UP").length;
      const total = services.length;
      const icon = status === "UP" ? "↑" : status === "DOWN" ? "↓" : "!";

      const servicesHTML = services.map(service => `
        <div class="service-row">
          <span class="svc-port">${service.port}</span>
          <span class="svc-proto">${service.protocol}</span>
          <span class="svc-badge ${svcClass(service.status)}">${service.status}</span>
          <span>
            <a class="svc-link" href="${service.url}" target="_blank" onclick="event.stopPropagation()">Test URL</a>
            <span class="svc-http"> · HTTP ${service.http_code}</span>
          </span>
        </div>
      `).join("");

      const card = document.createElement("div");
      card.className = "card" + (status === "DOWN" ? " is-down" : "");
      card.id = "card-" + server.host;

      card.innerHTML = `
        <div class="card-collapsed">
          <div class="card-left">
            <div class="status-ring ${ringClass(status)}">${icon}</div>
            <div>
              <div class="server-name">${server.host}</div>
              <div class="server-domain">${server.domain}</div>
            </div>
          </div>

          <div class="card-right">
            <div class="ports-pill" style="color:${upCount === total ? "var(--green)" : status === "DOWN" ? "var(--red)" : "var(--yellow)"}">
              ${upCount}/${total} porte
            </div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>
        </div>

        <div class="card-details">
          <div class="meta-row">
            <div class="meta-chip">SSH <span>${server.ssh_status}</span></div>
            <div class="meta-chip">
              Informatica
              <span style="color:${server.informatica_process_status === "UP" ? "var(--green)" : "var(--red)"}">
                ${server.informatica_process_status}
              </span>
            </div>
          </div>

          <div class="services-list">${servicesHTML}</div>
          <div class="timestamp">${server.timestamp}</div>
        </div>
      `;

      card.addEventListener("mousemove", e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty("--mx", (e.clientX - r.left) + "px");
        card.style.setProperty("--my", (e.clientY - r.top) + "px");
      });

      card.addEventListener("click", e => {
        e.stopPropagation();
        card.classList.toggle("open");
      });

      cardMap[server.host] = card;
      return card;
    }

    function renderGroup(name, servers, dashboard) {
      const section = document.createElement("section");
      section.className = "site-section";

      section.innerHTML = `
        <div class="section-header">
          <span class="section-label">${name}</span>
          <div class="section-line"></div>
          <span class="section-count">${servers.length} server</span>
        </div>
        <div class="grid"></div>
      `;

      const grid = section.querySelector(".grid");

      servers
        .sort((a, b) => a.host.localeCompare(b.host))
        .forEach(server => grid.appendChild(renderCard(server)));

      dashboard.appendChild(section);
    }

    function renderAlerts(servers) {
      const downServers = servers.filter(s => getStatus(s) === "DOWN");

      if (downServers.length === 0) return;

      document.getElementById("header-dot").classList.add("has-down");

      const alertList = document.getElementById("alert-list");

      downServers.forEach(server => {
        const downPorts = server.services.filter(p => p.status === "DOWN").length;

        const li = document.createElement("li");
        li.textContent = `${server.host} — Informatica: ${server.informatica_process_status} · ${downPorts} porta/e KO`;
        alertList.appendChild(li);
      });

      const banner = document.getElementById("alert-banner");
      banner.classList.add("visible");

      document.getElementById("alert-dismiss").addEventListener("click", e => {
        e.stopPropagation();
        banner.classList.remove("visible");
      });

      banner.addEventListener("click", () => {
        const first = cardMap[downServers[0].host];

        if (first) {
          first.scrollIntoView({ behavior: "smooth", block: "center" });
          first.classList.add("open");
        }
      });
    }

    async function loadDashboard() {
      const dashboard = document.getElementById("dashboard");
      const footer = document.getElementById("footer");

      dashboard.innerHTML = "";

      const servers = [];
      const errors = [];

      for (const file of jsonFiles) {
        try {
          const response = await fetch(file, { cache: "no-store" });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const text = await response.text();

          try {
            servers.push(JSON.parse(text));
          } catch (parseError) {
            errors.push(`
              <div class="error">
                JSON non valido:<br>
                <strong>${file}</strong><br><br>
                ${parseError.message}
              </div>
            `);
          }

        } catch (error) {
          errors.push(`
            <div class="error">
              Errore caricamento file:<br>
              <strong>${file}</strong><br><br>
              ${error.message}
            </div>
          `);
        }
      }

      Object.entries(serverGroups).forEach(([groupName, hosts]) => {
        const groupServers = servers.filter(server => hosts.includes(server.host));
        renderGroup(groupName, groupServers, dashboard);
      });

      const unknownServers = servers.filter(server =>
        !Object.values(serverGroups).flat().includes(server.host)
      );

      if (unknownServers.length > 0) {
        renderGroup("Altri server", unknownServers, dashboard);
      }

      if (errors.length > 0) {
        dashboard.insertAdjacentHTML("beforeend", errors.join(""));
      }

      if (servers.length > 0) {
        const latest = servers
          .map(s => s.timestamp)
          .sort()
          .reverse()[0];

        footer.textContent = "Ultimo aggiornamento: " + latest;
      }

      renderAlerts(servers);
    }

    loadDashboard();
  </script>
</body>
</html>
